<main class="auth">
  <h1>Crear cuenta</h1>
  <p class="sub">Registrate y llevate 20% de descuento en tu primera compra.</p>

  <form [formGroup]="form" (ngSubmit)="enviar()">
    <div class="fila">
      <label>Nombre <input formControlName="nombre" autocomplete="given-name" /></label>
      <label>Apellido <input formControlName="apellido" autocomplete="family-name" /></label>
    </div>

    <label>Email <input type="email" formControlName="email" autocomplete="email" /></label>
    <label>Contraseña <input type="password" formControlName="password" autocomplete="new-password" /></label>

    <fieldset>
      <legend>Fecha de nacimiento</legend>
      <div class="fila">
        <select formControlName="dia" aria-label="Día">
          <option [ngValue]="0" disabled>Día</option>
          @for (d of dias; track d) { <option [ngValue]="d">{{ d }}</option> }
        </select>
        <select formControlName="mes" aria-label="Mes">
          <option [ngValue]="0" disabled>Mes</option>
          @for (m of meses; track m; let i = $index) { <option [ngValue]="i + 1">{{ m }}</option> }
        </select>
        <select formControlName="anio" aria-label="Año">
          <option [ngValue]="0" disabled>Año</option>
          @for (a of anios; track a) { <option [ngValue]="a">{{ a }}</option> }
        </select>
      </div>
    </fieldset>

    <div class="fila">
      <label>Tipo de sangre
        <select formControlName="tipo_sangre">
          <option value="" disabled>Elegí</option>
          @for (t of tiposSangre; track t) { <option [value]="t">{{ t }}</option> }
        </select>
      </label>
      <label>Color de ojos
        <select formControlName="color_ojos">
          <option value="" disabled>Elegí</option>
          @for (c of coloresOjos; track c) { <option [value]="c">{{ c }}</option> }
        </select>
      </label>
    </div>

    <label>Días de vacaciones por año
      <input type="number" formControlName="dias_vacaciones" min="0" max="365" />
    </label>

    @if (error()) { <p class="error" role="alert">{{ error() }}</p> }

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Creando cuenta...' : 'Registrarme' }}
    </button>
    <p>¿Ya tenés cuenta? <a routerLink="/login">Ingresá</a></p>
  </form>
</main>
